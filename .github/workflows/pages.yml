# Publish the public catalog demo to GitHub Pages.
#
# The site is exactly one page: examples/catalog/catalog.html, served as index.html at
# https://dzivkovi.github.io/video-intel/. It is copied, not rebuilt, so the published
# page is byte-identical to the committed one that tests/test_catalog_demo.py pins.
# Nothing else in the repo is published: no Jekyll, no docs folder.
name: Publish catalog demo

on:
  push:
    branches: [main]
    paths:
      - examples/catalog/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the one page
        run: |
          mkdir _site
          cp examples/catalog/catalog.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

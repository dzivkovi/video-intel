  # Skool community, not YouTube. Do not run `scan` for this channel — there is no
  # YouTube URL to resolve. Use `mindmap --file` / `transcript --file` with videos
  # downloaded into G:/My Drive/video-intel/earlyaidopters/. Author metadata is

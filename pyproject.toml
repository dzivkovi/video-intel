[project]
name = "video-intel"
version = "1.3.0"
requires-python = ">=3.12"
dependencies = [
    "google-genai",
    "google-api-python-client",
    "pyyaml",
    "youtube-transcript-api",
    "httpx",
]

[project.optional-dependencies]
vector = [
    "lancedb>=0.20",
    "voyageai>=0.3",
]
pdf = [
    "reportlab>=4",
]
intelligence = [
    # neo4j deliberately absent: issue #95 retired Neo4j/GDS as the analytics
    # engine. The experimental intel_graph.py project/verify subcommands name
    # the manual `pip install neo4j` in their error message instead.
    "duckdb>=1.0",
    # numpy powers the SDSM null-model fit (scripts/sdsm_network.py, #98).
    "numpy>=1.26",
]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    # PDF test deps: without these, the briefing/markdown PDF tests silently
    # importorskip on a clean dev install and their strongest assertions
    # (clickable-link counts, sample-structure drift guard) never run.
    "reportlab>=4",
    "pypdf",
]

[tool.setuptools]
# This repo is a plugin of standalone scripts, not an importable package:
# nothing under scripts/ is meant to be site-packages-installed. Without
# this, setuptools flat-layout auto-discovery sees the plugin's top-level
# folders (skills/, prompts/, evals/, ...) as "multiple packages" and every
# documented `pip install -e ".[extra]"` fails on a fresh clone (found
# testing issue #102). Empty packages = install registers dependencies and
# metadata only, which is exactly the intent.
packages = []

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".git", ".claude", "work", "video-intel"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade (modernize syntax for 3.12)
    "B",    # flake8-bugbear (common pitfalls)
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "RUF005", # list concatenation — readability over micro-optimization
    "RUF015", # `list(x)[0]` vs `next(iter(x))` — readability
    "SIM108", # if/else vs ternary — explicit blocks are clearer
]

[tool.ruff.lint.isort]
known-first-party = ["video_intel", "gemini_common", "timestamp_utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-v"
# Surface INFO-level log records during eval runs (-s) so the
# query_expansion log lines from hybrid_search() are visible to humans
# skimming pytest output. The structural JSONL file written by the eval
# harness is the authoritative record — these are convenience logs only.
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)-7s %(message)s"
